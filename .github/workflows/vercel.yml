name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Select Doppler Environment
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; then
            echo "DOPPLER_TOKEN=${{ secrets.DOPPLER_TOKEN_PROD }}" >> $GITHUB_ENV
            echo "Using Production Doppler Config"
          else
            echo "DOPPLER_TOKEN=${{ secrets.DOPPLER_TOKEN_STAGING }}" >> $GITHUB_ENV
            echo "Using Staging Doppler Config"
          fi

      - name: Install Dependencies
        working-directory: dashboard
        run: doppler run -- npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Project Settings
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; then
            ENVIRONMENT=production
          else
            ENVIRONMENT=preview
          fi

          vercel pull \
            --yes \
            --environment=$ENVIRONMENT \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        working-directory: dashboard
        run: doppler run -- vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Database Migrate
        if: github.event_name == 'push'
        working-directory: dashboard
        run: doppler run -- npm run migrate

      - name: Deploy Production
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          doppler run -- vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview
        if: |
          github.ref_name == 'dev' ||
          github.event_name == 'pull_request'
        run: |
          doppler run -- vercel deploy \
            --prebuilt \
            --token=${{ secrets.VERCEL_TOKEN }}
